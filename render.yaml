services:
  - type: web
    name: duka-web
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn duka.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.0"
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com,dukanibot.com,www.dukanibot.com"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: CREDENTIAL_ENCRYPTION_KEY
        generateValue: true
      - key: AI_MODEL
        value: "gpt-4.1-mini"
      # Set these in the Render dashboard (Environment tab) — never committed here.
      # Supabase project → Settings → Database → Connection string (URI, "Transaction" pooler mode).
      - key: DATABASE_URL
        sync: false
      # Supabase project → Settings → Storage / S3 Connection.
      - key: SUPABASE_S3_ENDPOINT
        sync: false
      - key: SUPABASE_S3_ACCESS_KEY_ID
        sync: false
      - key: SUPABASE_S3_SECRET_ACCESS_KEY
        sync: false
      - key: SUPABASE_S3_BUCKET
        sync: false
      - key: SUPABASE_PUBLIC_URL
        sync: false
      # Resend project → API Keys. Requires a verified sending domain to email real users.
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: "Duka <no-reply@duka.example.com>"
      # A Ghala team API key the platform itself owns (Settings → Developer → API Keys) — not
      # any merchant's per-shop Connection.ghala_token — plus the name/language of its
      # Meta-approved authentication template (see OWNER_ACTION_REQUIRED.md item 7b).
      - key: GHALA_API_KEY
        sync: false
      - key: GHALA_OTP_TEMPLATE_NAME
        sync: false
      - key: GHALA_OTP_TEMPLATE_LANGUAGE
        value: "en"

  - type: worker
    name: duka-worker
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python manage.py process_jobs"
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.0"
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        fromService:
          type: web
          name: duka-web
          envVarKey: DJANGO_SECRET_KEY
      - key: CREDENTIAL_ENCRYPTION_KEY
        fromService:
          type: web
          name: duka-web
          envVarKey: CREDENTIAL_ENCRYPTION_KEY
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_S3_ENDPOINT
        sync: false
      - key: SUPABASE_S3_ACCESS_KEY_ID
        sync: false
      - key: SUPABASE_S3_SECRET_ACCESS_KEY
        sync: false
      - key: SUPABASE_S3_BUCKET
        sync: false
      - key: SUPABASE_PUBLIC_URL
        sync: false
