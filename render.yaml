databases:
  - name: duka-db
    plan: free
    databaseName: duka
    user: duka

services:
  - type: web
    name: duka-web
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn duka.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.0"
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: CREDENTIAL_ENCRYPTION_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: duka-db
          property: connectionString
      - key: AI_MODEL
        value: "gpt-4.1-mini"

  - type: worker
    name: duka-worker
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python manage.py process_jobs"
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.0"
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        fromService:
          type: web
          name: duka-web
          envVarKey: DJANGO_SECRET_KEY
      - key: CREDENTIAL_ENCRYPTION_KEY
        fromService:
          type: web
          name: duka-web
          envVarKey: CREDENTIAL_ENCRYPTION_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: duka-db
          property: connectionString
