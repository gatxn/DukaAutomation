name: keepalive

# Render's free plan puts the web service to sleep after ~15 minutes without traffic, and the
# first request afterwards takes 20+ seconds. Crawlers (Meta's business verification among
# them) time out on that, so they never see the page. A cheap ping every 10 minutes keeps it awake.
# Remove this once the service runs on a paid instance.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Wake the site and the home page
        run: |
          curl --silent --show-error --location --max-time 90 --retry 2 --output /dev/null \
            --write-out "home: %{http_code} in %{time_total}s\n" https://dukanibot.com/
          curl --silent --show-error --max-time 30 --output /dev/null \
            --write-out "healthz: %{http_code} in %{time_total}s\n" https://dukanibot.com/healthz/
